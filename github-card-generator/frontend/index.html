<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Dev Card Generator</title>
    <!-- Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
        }
        .glass {
            background: rgba(22, 27, 34, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid #30363d;
        }
        .btn-gradient {
            background: linear-gradient(90deg, #238636, #2ea043);
            transition: all 0.2s ease-in-out;
        }
        .btn-gradient:hover:not(:disabled) {
            transform: translateY(-1px);
            filter: brightness(1.1);
            box-shadow: 0 4px 12px rgba(46, 160, 67, 0.3);
        }
        .btn-gradient:active:not(:disabled) {
            transform: translateY(0);
        }
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .skeleton {
            background: linear-gradient(90deg, #161b22 25%, #21262d 50%, #161b22 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div id="root" class="w-full max-w-[600px]"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [username, setUsername] = useState('');
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const [copied, setCopied] = useState(false);

            const generateCard = async (e) => {
                if (e) e.preventDefault();
                if (!username) return;

                setLoading(true);
                setResult(null);
                setError(null);
                setCopied(false);

                try {
                    const response = await fetch(`/generate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: username.trim() })
                    });

                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(errData.detail || 'User not found or API error');
                    }

                    const data = await response.json();
                    setResult(data);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const copyToClipboard = () => {
                const fullUrl = `${window.location.origin}${result.card_url}`;
                navigator.clipboard.writeText(fullUrl);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            return (
                <div class="space-y-8 animate-fade-in">
                    <header class="text-center space-y-2">
                        <h1 class="text-4xl font-extrabold tracking-tight text-white">
                            GitHub Dev Card <span class="text-green-500">Generator</span>
                        </h1>
                        <p class="text-gray-400 text-lg">Enter any public GitHub username to generate a vibe card.</p>
                    </header>

                    <main class="glass p-8 rounded-2xl shadow-2xl">
                        <form onSubmit={generateCard} class="flex flex-col sm:flex-row gap-3">
                            <input 
                                type="text" 
                                placeholder="e.g. torvalds" 
                                class="flex-1 bg-[#0d1117] border border-[#30363d] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all placeholder:text-gray-600"
                                value={username}
                                onChange={(e) => setUsername(e.target.value)}
                                disabled={loading}
                            />
                            <button 
                                type="submit"
                                disabled={loading || !username}
                                class="btn-gradient px-8 py-3 rounded-xl font-bold text-white disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap"
                            >
                                {loading ? 'Analyzing...' : 'Generate Card'}
                            </button>
                        </form>

                        {error && (
                            <div class="mt-4 p-3 bg-red-900/20 border border-red-500/50 rounded-lg text-red-400 text-sm text-center">
                                ⚠️ {error}
                            </div>
                        )}
                    </main>

                    {loading && (
                        <div class="glass p-8 rounded-2xl space-y-4">
                            <div class="flex items-center space-x-4">
                                <div class="w-16 h-16 rounded-full skeleton"></div>
                                <div class="space-y-2 flex-1">
                                    <div class="h-4 w-1/3 skeleton rounded"></div>
                                    <div class="h-3 w-1/4 skeleton rounded"></div>
                                </div>
                            </div>
                            <div class="h-20 w-full skeleton rounded-xl"></div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="h-12 skeleton rounded-xl"></div>
                                <div class="h-12 skeleton rounded-xl"></div>
                            </div>
                            <div class="text-center text-xs text-gray-500 pulse">Gemini is analyzing repositories...</div>
                        </div>
                    )}

                    {result && (
                        <div class="space-y-4 animate-fade-in">
                            <div class="flex justify-between items-center px-2">
                                <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-500">Result</h2>
                                <button 
                                    onClick={copyToClipboard}
                                    class="text-xs bg-[#21262d] hover:bg-[#30363d] text-gray-300 px-3 py-1.5 rounded-lg border border-[#30363d] transition-colors flex items-center gap-2"
                                >
                                    {copied ? '✅ Link Copied!' : '🔗 Copy Card Link'}
                                </button>
                            </div>
                            <div class="rounded-2xl overflow-hidden shadow-2xl flex justify-center">
                                <div dangerouslySetInnerHTML={{ __html: result.html }} class="w-full" />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
